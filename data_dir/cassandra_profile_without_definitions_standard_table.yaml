### DML ###
keyspace: keyspace1
table: standard1

### Column Distribution Specifications ###
columnspec:
  - name: key
    size: fixed(10)
    population: uniform(1..20971520)

  - name: "C0"
    size: fixed(16)

  - name: "C1"
    size: fixed(16)

  - name: "C2"
    size: fixed(16)

  - name: "C3"
    size: fixed(16)

  - name: "C4"
    size: fixed(16)

insert:
  partitions: fixed(1)
  select:    fixed(1)/1
  batchtype: UNLOGGED

queries:
  insert:
    cql: INSERT INTO keyspace1.standard1 (key, "C0", "C1", "C2", "C3", "C4") VALUES (?,?,?,?,?,?)
    fields: samerow

  read:
    cql: SELECT * FROM keyspace1.standard1 WHERE key = ?
    fields: samerow
