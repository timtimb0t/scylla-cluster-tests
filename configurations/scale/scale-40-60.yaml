test_duration: 120

# Minimal repro: start from one seed node and grow the cluster in a single high-concurrency batch.
n_db_nodes: 1
add_node_cnt: 100
cluster_target_size: 21
n_loaders: 1

# Keep bootstrap/setup focused on node joins only.
parallel_node_operations: true
use_legacy_cluster_init: true
cluster_health_check: false
backtrace_decoding: false
use_preinstalled_scylla: false
nemesis_class_name: 'NoOpMonkey'
nemesis_during_prepare: false

instance_type_runner: 'n2-highmem-64'
root_disk_size_runner: 1000

skip_test_stages:
  main_load: true

append_scylla_yaml:
  enable_tablets: true
  tablets_mode_for_new_keyspaces: 'enabled'
  enable_repair_based_node_ops: true
  append_scylla_args: '--logger-log-level topology_state_machine=debug, --logger-log-level raft_topology=debug, --logger-log-level group0_raft_sm=debug, --logger-log-level migration_manager=debug'
# GCP
gce_image_db: 'https://www.googleapis.com/compute/v1/projects/ubuntu-os-cloud/global/images/family/ubuntu-2604-lts-arm64'
gce_instance_type_db: 'c4a-highmem-8'
gce_root_disk_type_db: 'hyperdisk-balanced'
gce_n_local_ssd_disk_db: 0
user_prefix: 'cluster-scale-40-60-test'
unified_package: 'https://s3.amazonaws.com/downloads.scylladb.com/downloads/scylla/relocatable/scylladb-2026.1/scylla-unified-2026.1.5-0.20260602.678ab80fc38b.aarch64.tar.gz'

