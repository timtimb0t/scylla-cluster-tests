test_duration: 600
n_db_nodes: 1
#cluster_target_size: 21
add_node_cnt: 100

# AWS / EC2 defaults for regular nodes
instance_type_db: 'i4g.2xlarge'
instance_type_loader: 'c6i.xlarge'
instance_type_monitor: 't3.2xlarge'
n_loaders: 1
parallel_node_operations: true

skip_test_stages:
  main_load: true

user_prefix: 'cluster-scale-40-60-test'

# This is in order to start the basic cluster faster
use_legacy_cluster_init: true

# Takes too long on big clusters
cluster_health_check: false

backtrace_decoding: false
nemesis_class_name: 'NoOpMonkey'
nemesis_during_prepare: false